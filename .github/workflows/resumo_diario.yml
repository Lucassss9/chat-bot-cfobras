name: Resumo diario de pendencias

on:
  schedule:
    - cron: "0 21 * * 1-5"
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o Render
        run: curl -s -o /dev/null --max-time 90 https://chat-bot-cfobras.onrender.com/ || true

      - name: Pedir o resumo
        run: |
          resposta=$(curl -s -w "\n%{http_code}" -X POST \
            --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -H "X-Chave-Resumo: ${{ secrets.CHAVE_RESUMO }}" \
            https://chat-bot-cfobras.onrender.com/resumo/pendentes/agendado)

          corpo=$(echo "$resposta" | head -n -1)
          codigo=$(echo "$resposta" | tail -n 1)

          echo "HTTP $codigo"
          echo "$corpo"

          if [ "$codigo" != "200" ]; then
            echo "::error::O envio do resumo falhou (HTTP $codigo)"
            exit 1
          fi